# Ad ogni modifica controlla che i conteggi diano gli stessi numeri del file Excel
name: Test dei conteggi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintassi dei file
        run: for f in js/*.js js/views/*.js; do node --check "$f"; done
      - name: Test
        run: node --test tests/*.test.mjs
